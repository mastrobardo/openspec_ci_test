# Stage 1 of the OpenSpec lifecycle: turn tasks/<task>.txt into an OpenSpec change on a draft PR.
# Agent logic: scripts/run-agent.sh. Checks: scripts/openspec-ops.sh. This file only orchestrates.
name: OpenSpec Plan
run-name: "Plan · ${{ inputs.task }} (${{ inputs.model }})"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task id (reads tasks/<task>.txt), e.g. task-1"
        required: true
        type: string
      model:
        description: "Claude model alias (latest model of that family)"
        required: true
        type: choice
        default: sonnet
        options: [sonnet, opus, fable]

permissions:
  contents: write        # push the openspec/<task> branch
  pull-requests: write   # open the draft PR

concurrency:
  group: openspec-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TASK: ${{ inputs.task }}   # always used via env, never interpolated into scripts
    steps:
      - uses: actions/checkout@v7
        id: checkout

      - name: Check input and branch
        id: input
        run: |
          [[ "$TASK" =~ ^task-[0-9]+$ ]] || { echo "::error::task must look like task-N" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          [[ -f "tasks/$TASK.txt" ]] || { echo "::error::tasks/$TASK.txt not found" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          if git ls-remote --exit-code --heads origin "openspec/$TASK" >/dev/null; then
            echo "::error::branch openspec/$TASK already exists; close/delete it to re-plan" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"
            exit 1
          fi

      - uses: actions/setup-node@v7
        id: setup_node
        with:
          node-version: 22

      - name: Install OpenSpec and Claude Code
        id: install
        run: npm install -g @fission-ai/openspec@1.14.1 @anthropic-ai/claude-code@2.1.322

      - name: Run agent (plan)
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ inputs.model }}
        run: scripts/run-agent.sh plan "$TASK"

      - name: Guard - planning touched only openspec/
        id: guard
        run: scripts/openspec-ops.sh guard-plan-diff

      - name: Find and validate change
        id: change
        run: |
          change="$(scripts/openspec-ops.sh change-id "$TASK")"
          scripts/openspec-ops.sh validate "$change"
          scripts/openspec-ops.sh new-specs-have-purpose "$change"
          echo "id=$change" >> "$GITHUB_OUTPUT"

      - name: Write manifest
        id: manifest
        env:
          CHANGE: ${{ steps.change.outputs.id }}
          MODEL: ${{ inputs.model }}
        run: |
          # model = the alias picked here; every later stage reads it (single point of choice).
          # plan_model = what the run reported, kept for the record.
          model="$(jq -r '.modelUsage // {} | keys | join(",")' .openspec-ci/runs/plan.json)"
          scripts/openspec-ops.sh manifest task="$TASK" change="$CHANGE" stage=plan status=planned \
            model="$MODEL" \
            plan_run_id="$GITHUB_RUN_ID" plan_run_attempt="$GITHUB_RUN_ATTEMPT" \
            plan_model="${model:-unknown}" base_sha="$GITHUB_SHA"

      - name: Commit, push and open draft PR
        id: pr
        env:
          CHANGE: ${{ steps.change.outputs.id }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="openspec/$TASK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add openspec .openspec-ci/manifests
          git commit -m "openspec($TASK): plan $CHANGE"
          git push -u origin "$branch"

          body="$RUNNER_TEMP/pr-body.md"
          if [[ -s .openspec-ci/runs/plan.md ]]; then
            cat .openspec-ci/runs/plan.md > "$body"
          else
            echo "change: $CHANGE (the agent returned no report)" > "$body"
          fi
          printf '\n---\nGenerated by [OpenSpec Plan](%s). Mark **Ready for review** to start Apply.\n' \
            "$RUN_URL" >> "$body"

          url="$(gh pr create --draft --base main --head "$branch" \
            --title "OpenSpec: $CHANGE" --body-file "$body")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run summary (job summary + summary.md; on failure, why)
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          CHANGE: ${{ steps.change.outputs.id }}
          PR_URL: ${{ steps.pr.outputs.url }}
          CLAUDE_MODEL: ${{ inputs.model }}
        run: |
          mkdir -p .openspec-ci/runs
          scripts/run-summary.sh plan "Plan: $TASK" change="$CHANGE" PR="$PR_URL" > .openspec-ci/runs/summary.md
          cat .openspec-ci/runs/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload agent output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openspec-plan-${{ inputs.task }}-${{ github.run_id }}
          path: .openspec-ci/runs/
          if-no-files-found: ignore
