# Trampoline (024): turns the human PR gates into dispatches of the real workflows on main.
#   Ready for review              -> OpenSpec Apply  (pr=N, mode=apply)
#   Review "Request changes"      -> OpenSpec Apply  (pr=N, mode=reapply)
#   Review "Approve"              -> OpenSpec Verify (pr=N, approved_sha=<review commit>)
# Why: PR-event workflows run from the PR's merge ref, which GitHub rebuilds lazily, so a PR could
# run an old Apply/Verify or nothing at all (3 round trips on PR #1). Dispatches always run the
# workflow file from the default branch, and a dispatch made with GITHUB_TOKEN does start a run.
# This file itself still runs from the merge ref, so keep it small and stable; a PR opened before
# it existed needs the manual fallbacks (gh workflow run "OpenSpec Apply|Verify" -f pr=N).
# A review on a DRAFT PR dispatches nothing: Events comments "mark it Ready for review first" (029).
# No checkout, no secret, no agent: the dispatched workflows re-check everything.
name: OpenSpec Events
run-name: >-
  Events · ${{ github.event.pull_request.title }} ·
  ${{ github.event_name == 'pull_request' && 'ready for review' || github.event.review.state }}${{ github.event.pull_request.draft && ' (draft)' || '' }}

on:
  pull_request:
    types: [ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  actions: write         # gh workflow run
  pull-requests: write   # tell the reviewer when a review on a draft is ignored

jobs:
  dispatch:
    # Same-repo openspec/task-N branches only; reviews only when they approve or request changes.
    if: >-
      startsWith(github.event.pull_request.head.ref, 'openspec/task-') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name == 'pull_request' ||
       github.event.review.state == 'approved' ||
       github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ignore reviews on a draft PR (comment instead)
        id: draft
        if: github.event_name == 'pull_request_review' && github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          STATE: ${{ github.event.review.state }}
        run: |
          case "$STATE" in approved) what="Approve (which runs Verify)" ;; *) what="Request changes (which runs re-apply)" ;; esac
          body="$RUNNER_TEMP/draft.md"
          { echo "## ⏸️ OpenSpec: review ignored, this PR is still a draft"; echo
            echo "$what only works once the change is implemented. Mark the PR **Ready for review** first:"
            echo "that runs Apply. Then review again."
          } > "$body"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          echo "### OpenSpec Events: PR #$PR · $STATE on a draft: ignored (comment posted)" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the stage workflow on the default branch
        id: dispatch
        if: github.event_name == 'pull_request' || !github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          STATE: ${{ github.event.review.state }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
          TITLE: ${{ github.event.pull_request.title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_EVENT_NAME:$STATE" in
            pull_request:)                       wf="OpenSpec Apply";  args=(-f mode=apply) ;;
            pull_request_review:changes_requested) wf="OpenSpec Apply";  args=(-f mode=reapply) ;;
            pull_request_review:approved)        wf="OpenSpec Verify"; args=(-f approved_sha="$REVIEW_SHA") ;;
            *) echo "::error::unexpected event $GITHUB_EVENT_NAME:$STATE"; exit 1 ;;
          esac
          gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f pr="$PR" -f label="$TITLE" "${args[@]}"
          echo "dispatched: $wf pr=$PR ${args[*]} (ref $DEFAULT_BRANCH)"
          {
            echo "### OpenSpec Events: PR #$PR"
            echo "- event: \`$GITHUB_EVENT_NAME${STATE:+ ($STATE)}\`"
            echo "- dispatched: **$wf** \`pr=$PR ${args[*]}\` on \`$DEFAULT_BRANCH\`"
            echo "- runs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions?query=event%3Aworkflow_dispatch"
          } >> "$GITHUB_STEP_SUMMARY"
