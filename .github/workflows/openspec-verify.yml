# Stage 3 of the OpenSpec lifecycle: verify the implementation on an approved PR, then archive it
# behind a manual gate.
#   Review with "Approve"   -> verify the approved head
#   Manual (pr=N)           -> verify the current head (no approval check)
# Job "verify" is read-only and never commits (a push after approval would change the approved head).
# The verdict goes to a PR comment, the job summary and the artifact; non-PASS fails the job.
# Job "archive" (D13) runs only after PASS and waits for a reviewer of environment
# "openspec-archive". It runs `openspec archive` (deterministic, no agent, no Claude secret), pushes
# the archive commit and asks for a squash merge.
# Model, task and change come from .openspec-ci/manifest.json (chosen once, at Plan).
# Scripts are TRUSTED copies from the workflow's own commit (main), never from the PR branch.
name: OpenSpec Verify

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (branch openspec/task-N)"
        required: true
        type: string

permissions:
  contents: read         # verify never pushes (archive raises this at job level)
  pull-requests: write   # post the verdict as a PR comment

# Concurrency is per job: a waiting archive approval must never block Apply on the same PR.

defaults:
  run:
    shell: bash          # -eo pipefail

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.review.state == 'approved' &&
       startsWith(github.event.pull_request.head.ref, 'openspec/task-') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: openspec-pr-${{ github.event.pull_request.number || inputs.pr }}   # shared with Apply
      cancel-in-progress: false
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}   # used via env only
    outputs:
      verdict: ${{ steps.agent.outputs.verdict }}
      sha: ${{ steps.pr.outputs.sha }}
      head: ${{ steps.pr.outputs.head }}
      change: ${{ steps.m.outputs.change }}
      task: ${{ steps.m.outputs.task }}
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          info="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json headRefName,headRefOid,isCrossRepository,isDraft,state)"
          head="$(jq -r .headRefName <<<"$info")"
          sha="$(jq -r .headRefOid <<<"$info")"
          [[ "$head" =~ ^openspec/task-[0-9]+$ ]] || { echo "::error::branch $head is not openspec/task-N" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          [[ "$(jq -r .isCrossRepository <<<"$info")" == false ]] || { echo "::error::fork PRs are not supported" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          [[ "$(jq -r .state <<<"$info")" == OPEN ]] || { echo "::error::PR #$PR is not open" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          [[ "$(jq -r .isDraft <<<"$info")" == false ]] || { echo "::error::PR #$PR is still a draft" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == pull_request_review && "$REVIEW_SHA" != "$sha" ]]; then
            echo "::error::approval is stale: it was for ${REVIEW_SHA:0:7} but the PR head is ${sha:0:7}. Re-approve." | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"
            exit 1
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow commit (trusted scripts)
        id: checkout_scripts
        uses: actions/checkout@v7

      - name: Stash trusted scripts outside the workspace
        id: stash_scripts
        run: |
          cp -R scripts "$RUNNER_TEMP/ci-scripts"
          echo "CI_SCRIPTS=$RUNNER_TEMP/ci-scripts" >> "$GITHUB_ENV"

      - name: Checkout PR head (the work)
        id: checkout_pr
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}   # exactly the commit being verified
          fetch-depth: 0                       # full history + origin/main, so the agent can diff the PR

      - name: Read manifest
        id: m
        run: |
          m=.openspec-ci/manifest.json
          [[ -f "$m" ]] || { echo "::error::$m missing" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          task="$(jq -r '.task // empty' "$m")"
          stage="$(jq -r '.stage // empty' "$m")"
          [[ "$stage" != archived ]] || { echo "::error::already archived; nothing to verify" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          [[ "$stage" == apply || "$stage" == reapply ]] \
            || { echo "::error::nothing to verify: manifest stage is '$stage' (run Apply first)" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          model="$(jq -r '.model // empty' "$m")"
          if [[ -z "$model" ]]; then
            model="$(jq -r '.plan_model // empty' "$m")"
            [[ -z "$model" || "$model" == *,* ]] && model=sonnet
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "change=$(jq -r '.change // empty' "$m")" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        id: setup_pnpm
        with:
          version: 10

      - uses: actions/setup-node@v7
        id: setup_node
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and tools
        id: install
        run: |
          pnpm install --frozen-lockfile
          npm install -g @fission-ai/openspec@1.14.1 @anthropic-ai/claude-code@2.1.322

      - name: Deterministic checks (change, validate, tasks)
        id: precheck
        env:
          TASK: ${{ steps.m.outputs.task }}
          CHANGE: ${{ steps.m.outputs.change }}
        run: |
          found="$("$CI_SCRIPTS"/openspec-ops.sh change-id "$TASK")"
          [[ "$found" == "$CHANGE" ]] || { echo "::error::manifest change '$CHANGE' != openspec change '$found'" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          "$CI_SCRIPTS"/openspec-ops.sh validate "$CHANGE"
          "$CI_SCRIPTS"/openspec-ops.sh tasks-complete "$CHANGE"

      - name: Run agent (verify)
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ steps.m.outputs.model }}
          TASK: ${{ steps.m.outputs.task }}
          CHANGE: ${{ steps.m.outputs.change }}
        run: |
          set +e
          "$CI_SCRIPTS"/run-agent.sh verify "$TASK" "$CHANGE"
          rc=$?
          set -e
          case "$rc" in
            0) verdict=PASS ;;
            3) verdict=FAIL ;;
            4) verdict=INCONCLUSIVE ;;
            *) verdict=ERROR ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict (run-agent exit $rc)"

      - name: Guard - verify changed nothing
        id: guard
        env:
          CHANGE: ${{ steps.m.outputs.change }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: '"$CI_SCRIPTS"/openspec-ops.sh guard-diff verify "$CHANGE" "$SHA"'

      - name: Post verdict
        id: post_verdict
        if: always() && steps.agent.outputs.verdict != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.agent.outputs.verdict }}
          CHANGE: ${{ steps.m.outputs.change }}
          SHA: ${{ steps.pr.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$VERDICT" in
            PASS) icon="✅" ;; FAIL) icon="❌" ;; *) icon="⚠️" ;;
          esac
          body="$RUNNER_TEMP/comment.md"
          { echo "## $icon OpenSpec Verify: $VERDICT · \`$CHANGE\` @ ${SHA:0:7}"; echo
            if [[ -s .openspec-ci/runs/verify.md ]]; then cat .openspec-ci/runs/verify.md
            else echo "(the agent returned no report)"; fi
            printf '\n---\nGenerated by [OpenSpec Verify](%s).' "$RUN_URL"
            if [[ "$VERDICT" == PASS ]]; then printf ' Next: approve the **openspec-archive** gate in the run (Review deployments), then squash merge.\n'
            else printf ' Request changes or comment `/reapply [text]` to re-apply, then re-approve.\n'; fi
          } > "$body"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"

      - name: Fail unless PASS
        id: verdict_gate
        env:
          VERDICT: ${{ steps.agent.outputs.verdict }}
        run: |
          [[ "$VERDICT" == PASS ]] || { echo "::error::verify verdict: $VERDICT" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }

      - name: Run summary (job summary + summary.md; on failure, why)
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          CHANGE: ${{ steps.m.outputs.change }}
          CLAUDE_MODEL: ${{ steps.m.outputs.model }}
          VERDICT: ${{ steps.agent.outputs.verdict }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          mkdir -p .openspec-ci/runs
          if [[ -x "${CI_SCRIPTS:-}/run-summary.sh" ]]; then
            "$CI_SCRIPTS"/run-summary.sh verify "Verify: PR #$PR" change="$CHANGE @ ${SHA:0:7}" \
              "verdict=${VERDICT:-not reached}" > .openspec-ci/runs/summary.md
          else
            { echo "### OpenSpec Verify: PR #$PR"; echo "**Result: ❌ failed** before checkout"; echo
              sed 's/^::error::/- /' "$RUNNER_TEMP/openspec-ci-failures.txt" 2>/dev/null || true
            } > .openspec-ci/runs/summary.md
          fi
          cat .openspec-ci/runs/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload agent output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openspec-verify-pr${{ github.event.pull_request.number || inputs.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .openspec-ci/runs/
          if-no-files-found: ignore

  archive:
    needs: verify
    if: needs.verify.outputs.verdict == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: openspec-archive   # required reviewer = the manual gate
    permissions:
      contents: write        # push the archive commit to the PR branch
      pull-requests: write   # post the archive comment
    concurrency:
      group: openspec-archive-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
      HEAD_REF: ${{ needs.verify.outputs.head }}
      TASK: ${{ needs.verify.outputs.task }}
      CHANGE: ${{ needs.verify.outputs.change }}
    steps:
      - name: Check the PR has not moved since verify
        id: moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,state,isDraft)"
          [[ "$(jq -r .state <<<"$info")" == OPEN ]] || { echo "::error::PR #$PR is not open" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          [[ "$(jq -r .isDraft <<<"$info")" == false ]] || { echo "::error::PR #$PR is a draft" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          now="$(jq -r .headRefOid <<<"$info")"
          [[ "$now" == "$VERIFIED_SHA" ]] || {
            echo "::error::verified sha ${VERIFIED_SHA:0:7} is stale (head is now ${now:0:7}); re-verify" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          echo "archived_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout workflow commit (trusted scripts)
        id: checkout_scripts
        uses: actions/checkout@v7

      - name: Stash trusted scripts outside the workspace
        id: stash_scripts
        run: |
          cp -R scripts "$RUNNER_TEMP/ci-scripts"
          echo "CI_SCRIPTS=$RUNNER_TEMP/ci-scripts" >> "$GITHUB_ENV"

      - name: Checkout PR branch (the work)
        id: checkout_pr
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.head }}

      - name: Confirm checkout is the verified commit
        id: confirm
        run: |
          [[ "$(git rev-parse HEAD)" == "$VERIFIED_SHA" ]] \
            || { echo "::error::branch moved during checkout; re-verify" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          stage="$(jq -r '.stage // empty' .openspec-ci/manifest.json)"
          [[ "$stage" == apply || "$stage" == reapply ]] || { echo "::error::manifest stage '$stage' cannot be archived" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }

      - uses: actions/setup-node@v7
        id: setup_node
        with:
          node-version: 22

      - name: Install OpenSpec
        id: install
        run: npm install -g @fission-ai/openspec@1.14.1

      - name: Archive change and validate main specs
        id: archive
        run: |
          "$CI_SCRIPTS"/openspec-ops.sh validate "$CHANGE"
          openspec archive -y "$CHANGE"
          archived="$(find openspec/changes/archive -mindepth 1 -maxdepth 1 -type d -name "*-$CHANGE" \
                      | sed 's|.*/||' | sort | tail -1)"
          [[ -n "$archived" && ! -d "openspec/changes/$CHANGE" ]] || { echo "::error::archive did not move the change" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          openspec validate --all --strict --no-interactive
          specs="$(git status --porcelain --untracked-files=all -- openspec/specs | sed 's/^...//' \
                   | awk -F/ '{print $3}' | sort -u | paste -sd, -)"
          echo "archived=$archived" >> "$GITHUB_OUTPUT"
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

      - name: Guard - archive changed only openspec/
        id: guard
        run: '"$CI_SCRIPTS"/openspec-ops.sh guard-plan-diff'

      - name: Write manifest, commit, push and comment
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVED: ${{ steps.archive.outputs.archived }}
          SPECS: ${{ steps.archive.outputs.specs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "$CI_SCRIPTS"/openspec-ops.sh manifest stage=archived status=archived archived_as="$ARCHIVED" \
            archive_run_id="$GITHUB_RUN_ID" archived_at="$archived_at" verified_sha="$VERIFIED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A openspec .openspec-ci/manifest.json
          git commit -m "openspec($TASK): archive $CHANGE"
          git push origin "HEAD:$HEAD_REF"

          body="$RUNNER_TEMP/comment.md"
          { echo "## 📦 OpenSpec Archive: \`$CHANGE\`"; echo
            echo "- archived as \`openspec/changes/archive/$ARCHIVED/\`"
            echo "- main specs updated: \`${SPECS:-none}\` (\`openspec/specs/\`)"
            echo "- verified commit: ${VERIFIED_SHA:0:7}; archive commit: $(git rev-parse --short HEAD)"
            printf '\n**Ready to squash merge.**\n\n---\nGenerated by [OpenSpec Verify → archive](%s).\n' "$RUN_URL"
          } > "$body"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          {
            echo "### OpenSpec Archive: PR #$PR"
            echo "- archived as: $ARCHIVED"
            echo "- main specs: ${SPECS:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run summary on failure
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          if [[ -x "${CI_SCRIPTS:-}/run-summary.sh" ]]; then
            "$CI_SCRIPTS"/run-summary.sh archive "Archive: PR #$PR" change="$CHANGE" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### OpenSpec Archive: PR #$PR"; echo "**Result: ❌ failed** before checkout"; echo
              sed 's/^::error::/- /' "$RUNNER_TEMP/openspec-ci-failures.txt" 2>/dev/null || true
            } >> "$GITHUB_STEP_SUMMARY"
          fi
