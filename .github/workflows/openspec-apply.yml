# Stage 2 of the OpenSpec lifecycle: implement an approved change on its PR branch, and re-apply
# it after a review that requests changes.
#   Ready for review                -> apply    (dispatched by openspec-events.yml, mode=apply)
#   Review with "Request changes"   -> reapply  (dispatched by openspec-events.yml, mode=reapply;
#                                               classify feedback; requirement -> /opsx:update)
#   PR comment "/reapply [text]"    -> reapply  (owner/member/collaborator only)
#   Manual (pr=N, mode=auto)        -> reapply if there is new feedback since the last apply, else apply
# This workflow has no PR-event triggers: PR events run from the PR's merge ref, which GitHub
# rebuilds lazily (stale workflows, silent no-runs). openspec-events.yml turns them into dispatches,
# and dispatches and comments always run this file from main (024).
# Model, task and change come from .openspec-ci/manifest.json (chosen once, at Plan).
# Agent logic: scripts/run-agent.sh. Checks: scripts/openspec-ops.sh, scripts/pr-feedback.sh.
# Scripts are TRUSTED copies from the workflow's own commit (main), never from the PR branch:
# the branch may carry older scripts, and branch edits must not run with the Claude secret.
name: OpenSpec Apply

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (branch openspec/task-N)"
        required: true
        type: string
      mode:
        description: "auto = reapply if there is new feedback since the last apply, else apply"
        required: false
        type: choice
        default: auto
        options: [auto, apply, reapply]

permissions:
  contents: write        # push the implementation to the PR branch
  pull-requests: write   # post the report as a PR comment

concurrency:
  group: openspec-pr-${{ github.event.issue.number || inputs.pr }}   # shared with Verify
  cancel-in-progress: false

defaults:
  run:
    shell: bash          # -eo pipefail

jobs:
  apply:
    # Comments: only "/reapply" on a PR by owner/member/collaborator. "Resolve PR" checks the
    # branch (same-repo openspec/task-N, open, not draft) for both paths.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/reapply') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR: ${{ github.event.issue.number || inputs.pr }}   # used via env only
      FEEDBACK: .openspec-ci/runs/feedback.md
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          info="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json headRefName,isCrossRepository,isDraft,state)"
          head="$(jq -r .headRefName <<<"$info")"
          [[ "$head" =~ ^openspec/task-[0-9]+$ ]] || { echo "::error::branch $head is not openspec/task-N" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          [[ "$(jq -r .isCrossRepository <<<"$info")" == false ]] || { echo "::error::fork PRs are not supported" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          [[ "$(jq -r .state <<<"$info")" == OPEN ]] || { echo "::error::PR #$PR is not open" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          [[ "$(jq -r .isDraft <<<"$info")" == false ]] || { echo "::error::PR #$PR is still a draft" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Acknowledge /reapply comment
        id: ack
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes --silent || echo "::warning::could not add a reaction (continuing)"

      - name: Checkout workflow commit (trusted scripts)
        id: checkout_scripts
        uses: actions/checkout@v7

      - name: Stash trusted scripts outside the workspace
        id: stash_scripts
        run: |
          cp -R scripts "$RUNNER_TEMP/ci-scripts"
          echo "CI_SCRIPTS=$RUNNER_TEMP/ci-scripts" >> "$GITHUB_ENV"

      - name: Checkout PR branch (the work)
        id: checkout_pr
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head }}   # the PR branch itself, not the merge ref

      - name: Read manifest
        id: m
        env:
          HEAD_REF: ${{ steps.pr.outputs.head }}
        run: |
          m=.openspec-ci/manifest.json
          [[ -f "$m" ]] || { echo "::error::$m missing on $HEAD_REF" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          task="$(jq -r '.task // empty' "$m")"
          change="$(jq -r '.change // empty' "$m")"
          [[ "$HEAD_REF" == "openspec/$task" ]] || { echo "::error::manifest task '$task' does not match $HEAD_REF" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          [[ "$(jq -r '.stage // empty' "$m")" != archived ]] \
            || { echo "::error::change already archived; revert the archive commit to reopen it" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          # Single point of model choice: the alias picked at Plan. Older manifests only have
          # plan_model (the resolved id); use it if it is a single model, else fall back to sonnet.
          model="$(jq -r '.model // empty' "$m")"
          if [[ -z "$model" ]]; then
            model="$(jq -r '.plan_model // empty' "$m")"
            [[ -z "$model" || "$model" == *,* ]] && model=sonnet
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "change=$change" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r '.apply_count // 0' "$m")" >> "$GITHUB_OUTPUT"
          echo "applied_at=$(jq -r '.applied_at // empty' "$m")" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Collect review feedback and pick mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          APPLIED_AT: ${{ steps.m.outputs.applied_at }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          # Never applied yet: a manual run is a first apply; a change request takes all feedback.
          since="${APPLIED_AT:--}"
          n="$("$CI_SCRIPTS"/pr-feedback.sh "$PR" "$since" "$FEEDBACK")"
          # A comment or a dispatched "Request changes" (mode=reapply) needs feedback to act on.
          wanted="${MODE_INPUT:-auto}"
          [[ "$GITHUB_EVENT_NAME" == issue_comment ]] && wanted=reapply
          case "$wanted" in
            apply) mode=apply ;;
            reapply)
              [[ "$n" -gt 0 ]] || { echo "::error::no review feedback since ${since} (only owner/members/collaborators count; empty reviews and a bare /reapply are ignored)" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
              mode=reapply ;;
            *)
              if [[ -n "$APPLIED_AT" && "$n" -gt 0 ]]; then mode=reapply; else mode=apply; fi ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "feedback_items=$n" >> "$GITHUB_OUTPUT"
          echo "mode=$mode feedback_items=$n since=$since"

      - uses: pnpm/action-setup@v6
        id: setup_pnpm
        with:
          version: 10

      - uses: actions/setup-node@v7
        id: setup_node
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and tools
        id: install
        run: |
          pnpm install --frozen-lockfile
          npm install -g @fission-ai/openspec@1.14.1 @anthropic-ai/claude-code@2.1.322

      - name: Check change before apply
        id: precheck
        env:
          TASK: ${{ steps.m.outputs.task }}
          CHANGE: ${{ steps.m.outputs.change }}
        run: |
          found="$("$CI_SCRIPTS"/openspec-ops.sh change-id "$TASK")"
          [[ "$found" == "$CHANGE" ]] || { echo "::error::manifest change '$CHANGE' != openspec change '$found'" | tee -a "$RUNNER_TEMP/openspec-ci-failures.txt"; exit 1; }
          "$CI_SCRIPTS"/openspec-ops.sh validate "$CHANGE"

      - name: Run agent
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ steps.m.outputs.model }}
          MODE: ${{ steps.mode.outputs.mode }}
          TASK: ${{ steps.m.outputs.task }}
          CHANGE: ${{ steps.m.outputs.change }}
        run: |
          if [[ "$MODE" == reapply ]]; then export OPENSPEC_CI_FEEDBACK="$FEEDBACK"; fi
          "$CI_SCRIPTS"/run-agent.sh "$MODE" "$TASK" "$CHANGE"

      - name: Guard - allowed files only (reapply lists spec impact)
        id: guard
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          CHANGE: ${{ steps.m.outputs.change }}
          BASE_SHA: ${{ steps.m.outputs.base_sha }}
        run: |
          "$CI_SCRIPTS"/openspec-ops.sh guard-diff "$MODE" "$CHANGE" "$BASE_SHA" > .openspec-ci/runs/spec-impact.txt
          cat .openspec-ci/runs/spec-impact.txt

      - name: Check scope changes are documented (reapply, D12)
        id: scope
        if: steps.mode.outputs.mode == 'reapply'
        env:
          CHANGE: ${{ steps.m.outputs.change }}
        run: '"$CI_SCRIPTS"/openspec-ops.sh scope-documented "$CHANGE" .openspec-ci/runs/spec-impact.txt'

      - name: Check result (tasks, validate, build, lint)
        id: check
        env:
          CHANGE: ${{ steps.m.outputs.change }}
        run: |
          "$CI_SCRIPTS"/openspec-ops.sh tasks-complete "$CHANGE"
          "$CI_SCRIPTS"/openspec-ops.sh validate "$CHANGE"
          # Output also goes to build.log so the run summary can quote a failure.
          pnpm build 2>&1 | tee .openspec-ci/runs/build.log
          pnpm lint 2>&1 | tee -a .openspec-ci/runs/build.log

      - name: Write manifest
        id: manifest
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          COUNT: ${{ steps.m.outputs.count }}
          MODEL: ${{ steps.m.outputs.model }}
          STARTED_AT: ${{ steps.pr.outputs.started_at }}
        run: |
          # applied_at = this run's start: the next re-apply reads feedback newer than this.
          "$CI_SCRIPTS"/openspec-ops.sh manifest stage="$MODE" status=applied model="$MODEL" \
            apply_run_id="$GITHUB_RUN_ID" apply_run_attempt="$GITHUB_RUN_ATTEMPT" \
            applied_at="$STARTED_AT" apply_count="$((COUNT + 1))"

      - name: Commit, push and comment
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
          ITEMS: ${{ steps.mode.outputs.feedback_items }}
          TASK: ${{ steps.m.outputs.task }}
          CHANGE: ${{ steps.m.outputs.change }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "openspec($TASK): $MODE $CHANGE"
          git push origin "HEAD:$HEAD_REF"

          body="$RUNNER_TEMP/comment.md"
          { if [[ "$MODE" == reapply ]]; then
              echo "## OpenSpec Re-apply: \`$CHANGE\` ($ITEMS review item(s))"; echo
              if [[ -s .openspec-ci/runs/spec-impact.txt ]]; then
                echo "> [!WARNING]"
                echo "> **Spec impact:** the review changed the approved plan. Check these artifacts:"
                sed 's/^/> - `/; s/$/`/' .openspec-ci/runs/spec-impact.txt
              else
                echo "> Spec impact: none (proposal, design and specs unchanged; tasks.md may have new follow-ups)."
              fi
              echo
            else
              echo "## OpenSpec Apply: \`$CHANGE\`"; echo
            fi
            if [[ -s ".openspec-ci/runs/$MODE.md" ]]; then cat ".openspec-ci/runs/$MODE.md"
            else echo "(the agent returned no report)"; fi
            printf '\n---\nGenerated by [OpenSpec Apply](%s). Approve to run Verify; ' "$RUN_URL"
            printf 'request changes or comment `/reapply [text]` to re-apply with your review comments.\n'
            printf 'If an event does not start a run, use `gh workflow run "OpenSpec Apply" -f pr=%s`.\n' "$PR"
          } > "$body"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"

      - name: Run summary (job summary + summary.md; on failure, why)
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          CHANGE: ${{ steps.m.outputs.change }}
          CLAUDE_MODEL: ${{ steps.m.outputs.model }}
          MODE: ${{ steps.mode.outputs.mode }}
          ITEMS: ${{ steps.mode.outputs.feedback_items }}
        run: |
          mkdir -p .openspec-ci/runs
          if [[ -x "${CI_SCRIPTS:-}/run-summary.sh" ]]; then
            "$CI_SCRIPTS"/run-summary.sh "${MODE:-apply}" "${MODE:-apply}: PR #$PR" \
              change="$CHANGE" "review feedback items=$ITEMS" > .openspec-ci/runs/summary.md
          else
            # Failed before the trusted scripts were stashed (e.g. Resolve PR).
            { echo "### OpenSpec ${MODE:-apply}: PR #$PR"; echo "**Result: ❌ failed** before checkout"; echo
              sed 's/^::error::/- /' "$RUNNER_TEMP/openspec-ci-failures.txt" 2>/dev/null || true
            } > .openspec-ci/runs/summary.md
          fi
          cat .openspec-ci/runs/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on failure (apply and reapply)
        # Only once the PR is known to be an open openspec/task-N PR; never for a skipped job.
        if: failure() && steps.pr.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          body="$RUNNER_TEMP/failure-comment.md"
          if [[ "$PUSH_OUTCOME" == failure ]]; then pushed="It failed while committing, pushing or commenting: check the branch."
          else pushed="Nothing was pushed."; fi
          { sed '1s/^### /## ❌ /' .openspec-ci/runs/summary.md
            printf '\n---\n%s [Run log and artifact](%s).\n' "$pushed" "$RUN_URL"
            printf 'To retry, comment `/reapply <what to change>` (the text is the feedback) or run `gh workflow run "OpenSpec Apply" -f pr=%s`.\n' "$PR"
          } > "$body"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"

      - name: Upload agent output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openspec-apply-pr${{ github.event.issue.number || inputs.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .openspec-ci/runs/
          if-no-files-found: ignore
